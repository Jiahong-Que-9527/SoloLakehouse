# OpenMetadata 1.5.6 (Collate images) for the default v2.5 stack.
# Env defaults: docker/openmetadata/openmetadata.env (generated from upstream compose; DB/ES hosts patched).

services:
  om-mysql:
    container_name: slh-om-mysql
    image: docker.getcollate.io/openmetadata/db:1.5.6
    command: ["--sort_buffer_size=10M"]
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - ./data/om-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysql",
          "--user=root",
          "--password=password",
          "-e",
          "use openmetadata_db",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  om-elasticsearch:
    container_name: slh-om-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms768m -Xmx768m"
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./data/om-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  om-migrate:
    container_name: slh-om-migrate
    image: docker.getcollate.io/openmetadata/server:1.5.6
    command: ["./bootstrap/openmetadata-ops.sh", "migrate"]
    env_file:
      - openmetadata/openmetadata.env
    depends_on:
      om-mysql:
        condition: service_healthy
      om-elasticsearch:
        condition: service_healthy

  # OpenMetadata 1.5.6 expects this setting while it creates the configured
  # Basic-auth admin users.  Some migrated or interrupted first-start states
  # contain the bot records but omit emailConfiguration, which makes that
  # bootstrap fail silently.  Keep the repair idempotent and before the API
  # server starts; it neither creates users directly nor stores credentials.
  om-bootstrap:
    container_name: slh-om-bootstrap
    image: docker.getcollate.io/openmetadata/db:1.5.6
    restart: "no"
    env_file:
      - openmetadata/openmetadata.env
    depends_on:
      om-mysql:
        condition: service_healthy
      om-migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        mysql --host=om-mysql --user="$${DB_USER}" --password="$${DB_USER_PASSWORD}" "$${OM_DATABASE}" <<'SQL'
        INSERT INTO openmetadata_settings (configType, json)
        VALUES (
          'emailConfiguration',
          JSON_OBJECT(
            'enableSmtpServer', FALSE,
            'senderMail', '',
            'serverEndpoint', '',
            'serverPort', 0,
            'username', '',
            'password', '',
            'transportationStrategy', 'SMTP_TLS',
            'templates', 'openmetadata'
          )
        )
        ON DUPLICATE KEY UPDATE configType = VALUES(configType);
        SQL

  openmetadata-server:
    container_name: slh-openmetadata-server
    image: docker.getcollate.io/openmetadata/server:1.5.6
    restart: unless-stopped
    env_file:
      - openmetadata/openmetadata.env
    environment:
      # This is a principal name, not a password. OpenMetadata creates the
      # matching Basic-auth user after om-bootstrap has restored its required
      # email configuration setting.
      AUTHORIZER_ADMIN_PRINCIPALS: "[${OPENMETADATA_ADMIN_PRINCIPAL:-admin}]"
    ports:
      # Access the admin UI over an SSH tunnel on remote hosts. Do not expose
      # the initial Basic-auth account directly on the public network.
      - "127.0.0.1:${OPENMETADATA_PORT:-8585}:8585"
      - "127.0.0.1:${OPENMETADATA_ADMIN_PORT:-8586}:8586"
    depends_on:
      om-mysql:
        condition: service_healthy
      om-elasticsearch:
        condition: service_healthy
      om-migrate:
        condition: service_completed_successfully
      om-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  # OpenMetadata submits UI test-connection and ingestion workflows to this
  # bundled Airflow runner. Keep it on the same Compose network as Trino so the
  # service hostname `trino:8080` is resolvable from the generated workflow.
  ingestion:
    container_name: slh-openmetadata-ingestion
    image: docker.getcollate.io/openmetadata/ingestion:1.5.6
    restart: unless-stopped
    depends_on:
      om-elasticsearch:
        condition: service_healthy
      om-mysql:
        condition: service_healthy
      openmetadata-server:
        condition: service_healthy
    environment:
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: /opt/airflow/dag_generated_configs
      DB_HOST: om-mysql
      DB_PORT: 3306
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow_db}
      DB_SCHEME: mysql+pymysql
      DB_USER: ${AIRFLOW_DB_USER:-airflow_user}
      DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pass}
    entrypoint: /bin/bash
    command: ["/opt/airflow/ingestion_dependency.sh"]
    expose:
      - "8080"
    volumes:
      - ingestion-volume-dag-airflow:/opt/airflow/dag_generated_configs
      - ingestion-volume-dags:/opt/airflow/dags
      - ingestion-volume-tmp:/tmp

volumes:
  ingestion-volume-dag-airflow:
  ingestion-volume-dags:
  ingestion-volume-tmp:
