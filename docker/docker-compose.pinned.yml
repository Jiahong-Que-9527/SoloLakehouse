# FinLakehouse runtime pin — prevents accidental `docker compose up --build`
# from replacing the L4 EWG pipeline image with stale main-branch code.
#
# Tagged: 2026-09-07 (full_pipeline_job SUCCESS run d0412f55)
# Recreate pins after intentional image upgrades:
#   docker tag sololakehouse-dagster-webserver:latest sololakehouse-dagster-webserver:<new-tag>
#   docker tag sololakehouse-dagster-daemon:latest sololakehouse-dagster-daemon:<new-tag>
#   update image tags below

services:
  dagster-webserver:
    image: sololakehouse-dagster-webserver:finlakehouse-pinned-20260907
    build: !reset null
    pull_policy: never
  dagster-daemon:
    image: sololakehouse-dagster-daemon:finlakehouse-pinned-20260907
    build: !reset null
    pull_policy: never
