[project]
name = "ecb-delta-lakehouse"
version = "0.1.0"
description = "D01: ECB Delta Lakehouse — Bronze/Silver/Gold contracts, MERGE, time travel and Free Edition runner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecb_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
