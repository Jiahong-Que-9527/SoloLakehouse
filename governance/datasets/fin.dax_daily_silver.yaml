dataset_id: fin.dax_daily_silver
owner: Jiahong Que
business_purpose: Provide cleaned DAX daily pricing and return features for downstream analysis.
refresh_sla: business_day
quality_class: governed_standard
consumers: [gold_features]
retention: 7_years_demo_policy
classification: internal_demo
source_of_truth: fin.dax_daily_bronze
approved_consumer_class: [internal_analytics]
access_policy_hint: Restricted to internal analytical and demonstration use.
layer: silver
physical_location: {catalog: hive, namespace: silver, table: dax_daily_cleaned}
dagster_asset_key: dax_silver
upstream_dataset_ids: [fin.dax_daily_bronze]
quality_rules:
  required_columns: [observation_date, open_price, high_price, low_price, close_price, volume, daily_return]
  non_null_columns: [observation_date, open_price, high_price, low_price, close_price, volume]
  min_row_count: 2
  date_column: observation_date
  max_gap_days: 5
  forbid_future_dates: true
