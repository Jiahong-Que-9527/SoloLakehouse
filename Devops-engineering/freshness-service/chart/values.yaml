replicaCount: 1

image:
  repository: ghcr.io/__IMAGE_OWNER__/freshness-service
  # The digest pin is owned by the environment values file.

service:
  type: ClusterIP
  port: 80

containerPort: 8000

# The service input document is provisioned in-cluster as a ConfigMap
# rendered from the environment values. Secrets are not required in v1.
input:
  inputFile: snapshot-fresh.json
  content: |
    {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
