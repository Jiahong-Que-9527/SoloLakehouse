name: Databricks D01 ECB Delta Lakehouse

on:
  push:
    branches: [main]
    paths:
      - 'databricks/01-ecb-delta-lakehouse/**'
      - '.github/workflows/databricks-ecb-lakehouse.yml'
  pull_request:
    paths:
      - 'databricks/01-ecb-delta-lakehouse/**'
      - '.github/workflows/databricks-ecb-lakehouse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: databricks/01-ecb-delta-lakehouse
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
