name: Energy forecasting MLOps

on:
  push:
    branches: [main]
    paths:
      - 'gcp/05-energy-forecasting-mlops/**'
      - '.github/workflows/energy-forecast.yml'
  pull_request:
    paths:
      - 'gcp/05-energy-forecasting-mlops/**'
      - '.github/workflows/energy-forecast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcp/05-energy-forecasting-mlops
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
