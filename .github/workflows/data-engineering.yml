name: data-engineering

on:
    pull_request:
        paths:
            - "Data-engineering/reference-warehouse/**"
            - ".github/workflows/data-engineering.yml"
    push:
        branches: [main]
        paths:
            - "Data-engineering/reference-warehouse/**"
            - ".github/workflows/data-engineering.yml"

jobs:
    duckdb-ci:
        name: dbt build (duckdb, offline fixtures)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: Data-engineering/reference-warehouse
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.12"
            - name: Sync locked dependencies
              run: uv sync --locked --python 3.12
            - name: dbt deps (dbt_utils)
              run: uv run --locked dbt deps --project-dir dbt_project --profiles-dir dbt_project
            - name: Ruff lint + format
              run: |
                  uv run --locked ruff check .
                  uv run --locked ruff format --check .
            - name: SQLFluff lint (dbt templater, duckdb dialect)
              run: uv run --locked sqlfluff lint dbt_project/models dbt_project/tests
            - name: Slim CI — restore prod manifest from last main run
              if: github.event_name == 'pull_request'
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  RUN_ID=$(gh run list --workflow=data-engineering.yml --branch=main --status=success --limit=1 --json databaseId -q '.[0].databaseId')
                  if [ -n "$RUN_ID" ]; then
                      gh run download "$RUN_ID" -n prod-state -D prod_state || echo "no prod-state artifact yet — full build fallback"
                  fi
            - name: Point the slim-ci tests at the restored prod state
              if: github.event_name == 'pull_request'
              run: echo "PROD_STATE_DIR=$PWD/prod_state" >> "$GITHUB_ENV"
            - name: Ingest fixtures + dbt source freshness + dbt build + pytest
              run: uv run --locked pytest -q
            - name: Upload prod manifest (state for the next PR's Slim CI)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v4
              with:
                  name: prod-state
                  path: Data-engineering/reference-warehouse/dbt_project/target/manifest.json
                  if-no-files-found: error
