name: Governed energy data product

on:
  push:
    branches: [main]
    paths:
      - 'gcp/04-governed-energy-data-product/**'
      - '.github/workflows/governed-energy-product-cloud.yml'
  pull_request:
    paths:
      - 'gcp/04-governed-energy-data-product/**'
      - '.github/workflows/governed-energy-product-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governed-energy-product-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcp/04-governed-energy-data-product
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: gcp/04-governed-energy-data-product/infra
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.2'
      - run: terraform fmt -check -diff
      - run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"
      - run: terraform plan -input=false -no-color -var "project_id=${{ vars.GCP_PROJECT_ID }}" -var "image=plan-only-placeholder" -var "input_release_id=plan-only" -var "candidate_id=plan-only"

  build-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet
      - name: Build and push image
        id: image
        run: |
          IMAGE="europe-west3-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/governed-energy-product/energy-product-publisher:${GITHUB_SHA::8}"
          docker build -t "$IMAGE" gcp/04-governed-energy-data-product
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  apply:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: gcp-test
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: gcp/04-governed-energy-data-product/infra
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.2'
      - run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"
      - run: terraform apply -input=false -auto-approve -no-color -var "project_id=${{ vars.GCP_PROJECT_ID }}" -var "image=${{ needs.build-push.outputs.image }}" -var "input_release_id=0f249cdb2d1c44ab8155fb810b178302" -var "candidate_id=cand-2026-11-21-third"
