name: Frankfurt Airport model serving

on:
  push:
    branches: [main]
    paths:
      - 'Frankfurt-Airport-adsb-intelligence/06-model-serving/**'
      - '.github/workflows/frankfurt-airport-model-serving.yml'
  pull_request:
    paths:
      - 'Frankfurt-Airport-adsb-intelligence/06-model-serving/**'
      - '.github/workflows/frankfurt-airport-model-serving.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frankfurt-Airport-adsb-intelligence/06-model-serving
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          python-version: '3.13'
      - run: uv run --locked python -m unittest -v
