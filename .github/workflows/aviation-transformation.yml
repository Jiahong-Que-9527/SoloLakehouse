name: Aviation Transformation

on:
  push:
    branches: [main]
    paths:
      - 'Fraport-adsb-intelligence/02-aviation-transformation/**'
      - '.github/workflows/aviation-transformation.yml'
  pull_request:
    paths:
      - 'Fraport-adsb-intelligence/02-aviation-transformation/**'
      - '.github/workflows/aviation-transformation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Synthetic tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fraport-adsb-intelligence/02-aviation-transformation
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.0'
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s . -p 'test_*.py' -v

  image:
    name: Container image
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build the project 02 image
        run: docker build -t eddf-transformation:ci Fraport-adsb-intelligence/02-aviation-transformation
      - name: Run the synthetic suite inside the image
        run: docker run --rm eddf-transformation:ci
