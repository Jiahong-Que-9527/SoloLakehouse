name: Charging forecast

on:
  push:
    branches: [main]
    paths:
      - 'Mlops-engineering/reference-workload/**'
      - '.github/workflows/charging-forecast.yml'
  pull_request:
    paths:
      - 'Mlops-engineering/reference-workload/**'
      - '.github/workflows/charging-forecast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mlops-engineering/reference-workload
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest

  # The training image is built from M05 onward (delivery plan, M05): the
  # pinned base image must keep building, and the CLI must start inside it.
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t charging-forecast:ci Mlops-engineering/reference-workload
      - run: docker run --rm charging-forecast:ci --version
