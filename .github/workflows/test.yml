name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scope:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      finance: ${{ steps.paths.outputs.finance }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        run: python3 scripts/ci_scope.py

  docs:
    name: ${{ needs.scope.outputs.docs == 'aviation' && 'Aviation public documentation' || 'Repository documentation' }}
    needs: scope
    if: needs.scope.outputs.docs != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: needs.scope.outputs.docs == 'aviation'
        run: make -C projects/aviation check
      - if: needs.scope.outputs.docs == 'repository'
        run: make docs-check check-agent-docs

  finance:
    name: Finance reference
    needs: scope
    if: needs.scope.outputs.finance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt -r requirements-dagster.txt
      - run: make -C projects/finance check
      - name: Build the Dagster image and validate definitions
        run: |
          docker build --file docker/dagster/Dockerfile --tag slh-dagster-ci .
          docker run --network none --env DAGSTER_HOME=/tmp slh-dagster-ci \
            dagster definitions validate -w dagster/workspace.yaml

  checks:
    needs: [scope, docs, finance]
    if: always() && (github.event_name != 'push' || !github.event.deleted)
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_SCOPE: ${{ needs.scope.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          FINANCE_SELECTED: ${{ needs.scope.outputs.finance }}
          FINANCE_RESULT: ${{ needs.finance.result }}
        run: |
          set -eu
          test "$SCOPE_RESULT" = success
          case "$DOCS_SCOPE" in
            aviation|repository) test "$DOCS_RESULT" = success ;;
            none) test "$DOCS_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
          case "$FINANCE_SELECTED" in
            true) test "$FINANCE_RESULT" = success ;;
            false) test "$FINANCE_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
