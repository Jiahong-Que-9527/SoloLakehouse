name: CI
# `on: [push, pull_request]` ran the whole suite twice for every PR-branch push:
# once per trigger, on two separate runners, each building the full Compose stack.
# That doubled CI cost and doubled exposure to the flaky compose-demo job.
# Scope push to main so a PR branch runs once, and main still runs post-merge.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.7
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # dagster/ imports the PyPI dagster package; install it so mypy does not
      # treat the local dagster/ code folder as the dagster module.
      - run: pip install -r requirements.txt -r requirements-dagster.txt
      - run: python scripts/check-agent-docs.py
      - run: python scripts/validate-dataset-contracts.py
      - run: mypy ingestion/ transformations/ ml/ scripts/ dagster/ governance/

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dagster.txt
      - run: pytest tests/ -v --tb=short --ignore=tests/integration --cov=ingestion --cov=transformations --cov=ml --cov=governance --cov=dagster --cov-report=term-missing --cov-fail-under=70

  compose-demo:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # docker-compose.yml/superset.yml/openmetadata.yml require POSTGRES_PASSWORD,
      # SUPERSET_ADMIN_PASSWORD, and OPENMETADATA_MYSQL_ROOT_PASSWORD with no
      # fallback default (see .env.secrets.example). CI has no real secrets and
      # never did; generate throwaway values scoped to this ephemeral runner so
      # the demo stack can boot. These are not used anywhere outside this job.
      - name: Generate CI-only secrets
        run: |
          cp .env.shared.example .env.shared
          cp .env.secrets.example .env.secrets
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env.secrets
          sed -i "s/^SUPERSET_ADMIN_PASSWORD=$/SUPERSET_ADMIN_PASSWORD=$(openssl rand -hex 24)/" .env.secrets
          sed -i "s/^OPENMETADATA_MYSQL_ROOT_PASSWORD=$/OPENMETADATA_MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)/" .env.secrets
          echo "DAX_FIXTURE_PATH=tests/fixtures/ewg_historical_bootstrap.json" >> .env.shared
      # Prebuild serially: `make setup` ends in `up -d --build`, whose bake path
      # builds all five images at once and OOMs BuildKit on a 4-core runner.
      # With the cache warm, that build step becomes a no-op.
      - name: Build images serially
        run: make build-images-serial
      - name: Run full v2.5 demo path
        run: |
          make setup
          make demo
      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 200 slh-postgres || true
          docker logs --tail 200 slh-minio || true
          docker logs --tail 200 slh-hive-metastore || true
          docker logs --tail 200 slh-trino || true
          docker logs --tail 200 slh-dagster-webserver || true
          docker logs --tail 200 slh-dagster-daemon || true
          docker logs --tail 200 slh-mlflow || true
      - name: Stop stack
        if: always()
        run: make down
