# Scoped CI for the district-forecast workload, mirroring the charging-forecast
# workflow shape (test + optional image job). Install at
# .github/workflows/district-forecast.yml and scope the paths to the
# workload's directory. The image job is optional: enable it from the
# milestone that containers the workload.

name: district-forecast

on:
  push:
    branches: [main]
    paths:
      - 'Mlops-engineering/district-forecast/**'
      - '.github/workflows/district-forecast.yml'
  pull_request:
    paths:
      - 'Mlops-engineering/district-forecast/**'
      - '.github/workflows/district-forecast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mlops-engineering/district-forecast
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
