charging_commerce:
    target: duckdb
    outputs:
        duckdb:
            type: duckdb
            path: "{{ env_var('CHARGING_COMMERCE_DUCKDB', 'data/warehouse.duckdb') }}"
            threads: 4
        bq:
            type: bigquery
            method: service-account
            keyfile: "{{ env_var('BQ_KEYFILE', 'data/bq-keyfile.json') }}"
            project: "{{ env_var('BQ_PROJECT', 'slh-gcp-test') }}"
            dataset: de_mart
            location: europe-west3
            threads: 4
            retries: 2
