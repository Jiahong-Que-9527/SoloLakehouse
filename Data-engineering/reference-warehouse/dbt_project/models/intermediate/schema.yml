version: 2

models:
    - name: int_sessions_latest
      description: "One row per session: the binding latest-event reduction (contract §3.2)."
      tests:
          - unique:
              column_name: session_id
      columns:
          - name: session_id
            tests: [not_null]

    - name: int_sessions_enriched_fx
      description: "Latest events enriched with revenue_date (Europe/Berlin), ECB FX and billed roaming fees."
      columns:
          - name: fx_rate_to_eur
            tests: [not_null]
          - name: fx_rate_status
            tests:
                - not_null
                - accepted_values: {values: ['observed', 'carried_forward']}
          - name: revenue_date
            tests: [not_null]
          - name: roaming_fee_local
            tests: [not_null]

    - name: int_sessions_wholesale_cost
      description: "Adds the DE-LU SMARD slot price containing session_started_at and wholesale_cost_eur."
      columns:
          - name: wholesale_eur_mwh
            tests: [not_null]
          - name: wholesale_cost_eur
            tests: [not_null]
