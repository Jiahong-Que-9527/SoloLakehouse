[project]
name = "charging-commerce"
version = "0.1.0"
description = "E01+ ingestion, raw layer and dbt warehouse for the European EV Charging & Roaming Commerce reference warehouse."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1.3",
    "pyarrow>=17.0.0",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "dbt-bigquery>=1.9,<2",
    "sqlfluff>=3.3",
    "sqlfluff-templater-dbt>=3.3",
]

[project.scripts]
charging-commerce = "charging_commerce.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charging_commerce"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
