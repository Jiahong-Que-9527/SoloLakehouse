# E07 optional wrapper: same topology as the local acceptance runs
# (scheduler + webserver + SQLite metadata), for reproducibility outside WSL.
# NOT part of the acceptance evidence (docker unavailable in the acceptance
# environment); the exercised path is `uv run --locked airflow standalone`
# with a disposable AIRFLOW_HOME — see ../07-orchestration-airflow/evidence/.

services:
  airflow-standalone:
    image: apache/airflow:2.11.2-python3.12
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.airflow-local:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
    restart: unless-stopped
