[project]
name = "de-starter"
version = "0.1.0"
description = "Data Engineering starter domain (extracted template, E08)"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4",
]

[dependency-groups]
dev = [
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb>=1.9",
    "pytest>=8",
    "ruff>=0.14",
    "sqlfluff>=4.5",
    "sqlfluff-templater-dbt>=4.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
