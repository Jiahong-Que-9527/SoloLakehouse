[project]
name = "governed-energy-data-product"
version = "0.1.0"
description = "G04: publish an approved energy dataset behind a quality gate, with auditable releases and restricted access"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
energy-product = "energy_product.cli:main"

[project.optional-dependencies]
cloud = ["google-cloud-bigquery>=3", "pyarrow>=23", "tzdata>=2024.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyarrow>=23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_product"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
