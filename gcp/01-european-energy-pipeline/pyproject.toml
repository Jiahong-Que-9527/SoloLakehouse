[project]
name = "energy-pipeline"
version = "0.1.0"
description = "Normalize and validate SMARD actual total load exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyarrow>=23", "tzdata>=2025.2"]

[project.scripts]
energy-pipeline = "energy_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
