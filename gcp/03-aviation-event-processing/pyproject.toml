[project]
name = "aviation-event-processing"
version = "0.1.0"
description = "G03: fold duplicated, late and invalid synthetic events into one current state per entity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cloud = ["google-cloud-bigquery>=3", "google-cloud-pubsub>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aviation_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
