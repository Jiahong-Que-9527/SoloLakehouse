[project]
name = "energy-forecasting-mlops"
version = "0.1.0"
description = "G05: traceable model delivery for the 15-minute load forecast — fixture, target, windows, evaluation, registry and batch scoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.6",
    "mlflow>=3.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
