[project]
name = "charging-forecast"
version = "0.1.0"
description = "Reference workload for ML Engineering: seeded EV charging dataset, point-in-time contract, forecasting pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=18",
    "pyyaml>=6",
]

[project.scripts]
charging-forecast = "charging_forecast.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charging_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
