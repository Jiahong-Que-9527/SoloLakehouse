# Dataset release config for dataset-v001.
# Frozen by the M01 decision record (docs/delivery-plan.md, 2026-11-21).
# Changing any value here produces a different dataset and means a new release ID.
release_id: dataset-v001
schema_version: charging-dataset-v1
seed: 20261121

window:
  start: "2025-01-01T00:00:00Z"
  end: "2026-12-31T23:00:00Z"   # inclusive hour, UTC

ingestion_delay_hours: 1        # lagged demand closes T minus this delay
forecast_issue_time: "06:00"    # Europe/Berlin, day-ahead
forecast_error_rho: 0.6
forecast_temp_sigma_c: 1.2

stations:
  count: 40
  districts: {D1: 8, D2: 6, D3: 7, D4: 7, D5: 6, D6: 6}
  poi_mix: {office: 14, retail: 10, residential: 10, highway: 6}
  capacity_kw:
    office: [150, 350]
    retail: [100, 250]
    residential: [50, 150]
    highway: [150, 350]
  active_from_default: "2025-01-01"
  active_from_late:
    "2026-10-01": [S038, S039, S040]   # cold-start regime

tariff:
  base_price_by_district: {D1: 0.35, D2: 0.33, D3: 0.37, D4: 0.32, D5: 0.36, D6: 0.39}
  step:
    date: "2026-04-01"
    districts: [D2, D5]
    surcharge_eur_kwh: 0.15
    elasticity: -0.12
    ramp_days: 14

heatwave:
  start: "2026-07-14"
  end: "2026-07-20"
  temp_offset_c: [8.0, 12.0]

anomaly_mode: false   # stale/missing forecasts; M07 drills only, never in a release
