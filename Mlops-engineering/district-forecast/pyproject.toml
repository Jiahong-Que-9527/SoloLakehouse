[project]
name = "district-forecast"
version = "0.1.0"
description = "district-forecast: onboarded from the ML delivery template"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.3",
    "numpy>=2.0",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
]

[project.scripts]
district-forecast = "district_forecast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/district_forecast"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
